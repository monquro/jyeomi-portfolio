<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>져미의 선반 — AI와 함께 만든 데이터 도구</title>
<meta name="description" content="AI와 함께 만든 데이터 도구들. 도구마다 내가 내린 판단이 하나씩 들어 있습니다.">
<meta name="theme-color" content="#0f1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="hero">
    <div class="badge" id="owner"></div>
    <p class="shelf-label" aria-hidden="true">MY SHELF</p>
    <h1 id="headline"></h1>
    <p id="intro" class="muted"></p>
    <p id="progress" class="progress"></p>
  </header>

  <!-- 만든 것을 선반에 진열한다. 하나를 누르면 꺼내서 자세히 본다 -->
  <section id="shelves" class="shelves" aria-label="만든 것"></section>

  <section id="proposal" class="proposal" hidden>
    <div class="label">제안</div>
    <h2 id="p-title"></h2>
    <p class="ask" id="p-ask"></p>
    <h3>근거</h3><ul id="p-evidence"></ul>
    <h3>틀린다면</h3><ul id="p-wrong"></ul>
    <h3>하지 말 것</h3><p id="p-dont"></p>
  </section>

  <footer class="fineprint">1주 퀴즈의 숫자는 공개 날씨·공휴일 데이터(Open-Meteo, Nager.Date)에서 직접 계산했습니다. 쿠폰은 시제품용 샘플입니다.</footer>
</main>

<!-- 꺼내 본 물건 + 아래에서 올라오는 설명 카드 -->
<div id="detail" class="detail" hidden>
  <div class="backdrop" data-close></div>
  <div id="lifted" class="lifted" aria-hidden="true"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="grip" aria-hidden="true"></div>
    <button id="d-close" class="close" data-close aria-label="닫기">✕</button>
    <p id="d-week" class="wk"></p>
    <h2><span id="d-emoji" aria-hidden="true"></span> <span id="d-title"></span> <small id="d-sub"></small></h2>
    <p id="d-line" class="line"></p>
    <div id="d-tags" class="tags"></div>
    <div id="d-stats" class="stats"></div>
    <div class="judge"><b>내가 내린 판단</b><span id="d-judge"></span></div>
    <a id="d-go" class="go" target="_blank" rel="noopener">써 보기 ↗</a>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
